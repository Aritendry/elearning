{% extends 'base.html' %}

{% block content %}

<h1>{{ post.title }}</h1>

<p>{{ post.content }}</p>

<p>
    Par <strong>{{ post.author.username }}</strong><br>
    {{ post.created_at }}
</p>

{% if post.media %}
    {% if post.is_video %}
        <video controls style="max-width:100%;">
            <source src="{{ post.media.url }}">
            Ton navigateur est trop vieux pour lire une vidéo.
        </video>
    {% else %}
        <img src="{{ post.media.url }}" alt="{{ post.title }}" style="max-width:100%;">
    {% endif %}
{% endif %}


{% endblock %}
